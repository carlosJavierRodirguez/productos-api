<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Productos - Prueba Técnica</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-light">

  <div class="container py-4">

    <h2 class="mb-4 text-center fw-bold">Lista de Productos</h2>

    <!-- Tabla -->
    <div class="table-responsive shadow-sm">
      <table class="table table-striped table-hover align-middle text-center">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Cantidad Disponible</th>
            <th>Descripción</th>
            <th>Categoría</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaProductos"></tbody>
      </table>
    </div>

    <hr class="my-5">

    <!-- Buscar por Categoría -->
    <div class="card p-4 shadow-sm mb-4">
      <h3 class="mb-3">Buscar productos por categoría</h3>

      <div class="row g-3">
        <div class="col-md-6">
          <input type="text" id="categoriaInput" class="form-control" placeholder="Ej: Tecnología" />
        </div>
        <div class="col-md-3">
          <button class="btn btn-primary w-100" onclick="buscarPorCategoria()">
            Buscar
          </button>
        </div>
      </div>

      <p id="mensaje" class="mt-3 text-danger fw-semibold"></p>
    </div>

    <!-- Buscar por ID -->
    <div class="card p-4 shadow-sm">
      <h3 class="mb-3">Buscar productos por ID</h3>

      <div class="row g-3">
        <div class="col-md-6">
          <input type="number" id="idInput" class="form-control" placeholder="Ej: 1" />
        </div>
        <div class="col-md-3">
          <button class="btn btn-success w-100" onclick="buscarId()">
            Buscar
          </button>
        </div>
      </div>

      <p id="mensajeId" class="mt-3 text-danger fw-semibold"></p>
    </div>

    <!-- Limpiar Filtros -->
    <div class="text-center mt-4">
      <button class="btn btn-secondary" onclick="limpiarFiltros()">
        Limpiar Filtros
      </button>
    </div>

  </div>

  <script src="js/peticiones.js"></script>
</body>

</html>
